<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0b1a44" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- spokes: the hub linking four tools -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="256" x2="150" y2="150"/>
    <line x1="256" y1="256" x2="362" y2="150"/>
    <line x1="256" y1="256" x2="150" y2="362"/>
    <line x1="256" y1="256" x2="362" y2="362"/>
  </g>

  <!-- four managed endpoints -->
  <g fill="#ffffff">
    <circle cx="150" cy="150" r="30"/>
    <circle cx="362" cy="150" r="30"/>
    <circle cx="150" cy="362" r="30"/>
    <circle cx="362" cy="362" r="30"/>
  </g>

  <!-- central hub -->
  <circle cx="256" cy="256" r="58" fill="#ffffff" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="26" fill="url(#bg)"/>
</svg>
