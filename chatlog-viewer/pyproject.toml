[project]
name = "chatlog-viewer"
version = "0.1.0"
description = "Read Claude Code and Codex session logs, grouped by folder or by time."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.basedpyright]
include = ["server.py", "parsers.py"]
typeCheckingMode = "standard"
