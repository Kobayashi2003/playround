<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蔵書棚 — lnlib</title>
<script>
  // The theme is read back before the first paint so the shelf does not flash
  // the wrong colours while React is still starting up.
  try {
    var t = localStorage.getItem("lnlib.theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* private mode: the media query decides instead */ }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
