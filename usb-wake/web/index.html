<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#e6e9ed"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#15181c"
      media="(prefers-color-scheme: dark)"
    />
    <title>Remote Wake</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wake" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main id="controller" class="controller">
      <header class="header">
        <a class="brand" href="./"
          ><span class="brand-icon" aria-hidden="true"
            ><svg viewBox="0 0 64 64">
              <path d="M32 12v20M20 19a19 19 0 1 0 24 0" /></svg
          ></span>
          <h1>Remote Wake</h1></a
        >
        <button id="logoutButton" class="text-button" hidden>Lock</button>
      </header>
      <section id="loginPanel" class="login-panel" hidden>
        <h2>Unlock</h2>
        <form id="loginForm">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          />
          <button class="primary-button" type="submit">Continue</button>
          <p id="loginError" class="form-message" role="alert"></p>
        </form>
      </section>
      <section
        id="controlPanel"
        class="control-panel"
        data-state="connecting"
        aria-label="PC control"
      >
        <div
          id="connection"
          class="connection"
          data-state="connecting"
          role="status"
        >
          <span class="status-dot" aria-hidden="true"></span
          ><span id="connectionText">Connecting</span>
        </div>
        <div class="power-area">
          <button
            id="wakeButton"
            class="power-button"
            aria-label="Wake PC"
            disabled
          >
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 10v22M19 17a22 22 0 1 0 26 0" />
            </svg>
          </button>
          <span id="buttonLabel" class="button-label" role="status"
            >Wake PC</span
          >
        </div>
        <p id="actionError" class="form-message" role="alert"></p>
        <section class="pc-panel" aria-labelledby="pcTitle">
          <div class="section-heading">
            <h2 id="pcTitle">PC</h2>
            <span id="pcState" class="pc-state" data-state="unknown"
              >Unknown</span
            >
          </div>
          <div id="pcActions" class="pc-actions"></div>
          <p id="pcHint" class="hint" hidden></p>
        </section>
        <section class="activity" aria-label="Last request">
          <div class="activity-heading">
            <span>Last request</span><time id="commandTime">—</time>
          </div>
          <p id="commandResult" role="status">No requests yet</p>
        </section>
      </section>
      <div class="side">
        <section id="eventsPanel" class="panel" aria-labelledby="eventsTitle">
          <div class="section-heading">
            <h2 id="eventsTitle">Activity</h2>
            <button id="moreEvents" class="text-button" type="button" hidden>
              Show all
            </button>
          </div>
          <ol id="events" class="events"></ol>
          <p id="eventsEmpty" class="hint">Nothing has happened yet.</p>
        </section>
        <section
          id="schedulePanel"
          class="panel"
          aria-labelledby="scheduleTitle"
        >
          <div class="section-heading">
            <h2 id="scheduleTitle">Scheduled wake</h2>
            <span id="nextWake" class="pc-state"></span>
          </div>
          <ul id="schedules" class="schedules"></ul>
          <form id="scheduleForm" class="schedule-form">
            <label class="visually-hidden" for="scheduleTime">Time</label>
            <input id="scheduleTime" type="time" value="08:00" required />
            <fieldset id="scheduleDays" class="chip-picker day-picker">
              <legend class="visually-hidden">Days</legend>
            </fieldset>
            <button class="secondary-button" type="submit">Add</button>
          </form>
          <p id="scheduleError" class="form-message" role="alert"></p>
          <p id="timeZone" class="hint"></p>
        </section>
        <section id="boardPanel" class="panel" aria-labelledby="boardTitle">
          <h2 id="boardTitle">Wake board</h2>
          <dl class="stats">
            <div>
              <dt>Temperature</dt>
              <dd id="boardTemperature">—</dd>
            </div>
            <div>
              <dt>Wi-Fi</dt>
              <dd id="boardSignal">—</dd>
            </div>
            <div>
              <dt>Uptime</dt>
              <dd id="boardUptime">—</dd>
            </div>
            <div>
              <dt>Firmware</dt>
              <dd id="boardFirmware">—</dd>
            </div>
          </dl>
          <fieldset id="ledPicker" class="chip-picker led-picker">
            <legend>LED</legend>
          </fieldset>
          <p id="ledHint" class="hint" hidden></p>
        </section>
      </div>
    </main>
  </body>
</html>
