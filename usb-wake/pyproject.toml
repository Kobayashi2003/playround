[project]
name = "usb-wake-tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["hidapi>=0.14,<1"]

[dependency-groups]
dev = ["ruff", "basedpyright", "pytest"]

[tool.ruff]
target-version = "py314"
src = ["tools"]
exclude = ["node_modules", "firmware", ".wrangler", "cloud/.wrangler"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["tools", "test"]
stubPath = "typings"
extraPaths = ["tools"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["tools"]
